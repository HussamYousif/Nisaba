name: CI

# "Full suite green; lint clean" is part of Done (AGENTS.md). CI enforces the
# part that runs without a device: compile, unit tests, lint (audit P2-6).
# The instrumented suite is intentionally left out — it needs an emulator and
# takes minutes (P3-5).

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build, unit-test, lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
